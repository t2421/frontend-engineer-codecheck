name: Publish review
on:
  workflow_run:
    workflows: [Review assets]
    types: [completed]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  identify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        name: Resolve an open PR at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" > "$RUNNER_TEMP/prs.json"
          number="$(jq -er --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '[.[] | select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo)] | if length == 1 then .[0].number else error("No unique current PR") end' "$RUNNER_TEMP/prs.json")"
          echo "number=$number" >> "$GITHUB_OUTPUT"
  publish:
    needs: identify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare-preview-${{ needs.identify.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.identify.outputs.number }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # workflow_run executes trusted default-branch code; never check out PR code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download static assets only
        run: gh run download "$RUN_ID" --name review-assets --dir review-assets
      - name: Publish Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          gh pr view "$PR_NUMBER" --json state,headRefOid --jq 'select(.state == "OPEN") | .headRefOid' | grep -Fx "$HEAD_SHA"
          # Asset files are uploaded as data, never executed in this privileged job.
          pnpm exec wrangler preview --config wrangler.review.jsonc --name "pr-$PR_NUMBER" --ignore-base-config --json > "$RUNNER_TEMP/preview-output.log"
          sed -n '/^{/,$p' "$RUNNER_TEMP/preview-output.log" > "$RUNNER_TEMP/preview.json"
          url="$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/preview.json")"
          curl --fail --silent --show-error "$url/" > /dev/null
          printf '<!-- cloudflare-pr-preview -->\nCloudflare UI Preview: %s\n\n対象commit: `%s`\n\nURLを知っている方が閲覧できます。本番API・Secretは使用しません。\n' "$url" "$HEAD_SHA" > "$RUNNER_TEMP/preview-comment.md"
      - name: Create or update the marked PR comment
        run: |
          comment_id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- cloudflare-pr-preview -->"))) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/preview-comment.md" '{body:$body}' | gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input -
          else
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/preview-comment.md"
          fi
  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Closed-event base code only. No PR code or artifacts are executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Delete only this PR Preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler preview delete --config wrangler.review.jsonc --name "pr-$PR_NUMBER" --skip-confirmation
