name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm test
      - name: Install Google Chrome
        run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Validate deployment bundle without deploying
        run: pnpm exec wrangler deploy --dry-run --config dist/population_viewer/wrangler.json
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  audit:
    name: Dependency audit (braces exception recorded)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit all dependencies
        run: |
          audit_status=0
          printf '%s\n' 'Approved exception: GHSA-vfj7-8cjw-p6xm (braces High); owner: t2421; review: 2026-10-14' > "$RUNNER_TEMP/dependency-audit.log"
          pnpm audit >> "$RUNNER_TEMP/dependency-audit.log" 2>&1 || audit_status=$?
          cat "$RUNNER_TEMP/dependency-audit.log"
          exit "$audit_status"
      - name: Save audit result even when audit fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.log
          if-no-files-found: warn
          retention-days: 7
